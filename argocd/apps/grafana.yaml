apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd

spec:
  project: default

  sources:

   - repoURL: https://grafana.github.io/helm-charts
     chart: grafana
     targetRevision: "10.2.0"
   
     helm:
       valueFiles:
         - $values/monitoring/grafana/values.yaml
   
   - repoURL: https://github.com/alaamagdy20211/my-ecommerce-devops.git
     targetRevision: main
     ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true