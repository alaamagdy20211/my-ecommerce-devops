apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      type: devops-frontend
  template:
    metadata:
      labels:
        app: frontend
        type: devops-frontend
    spec:
      containers:
      - name: frontend
        image: 524558748637.dkr.ecr.us-east-1.amazonaws.com/eks-cluster/frontend:latest
        imagePullPolicy: Always  
        ports:
        - containerPort: 80

    
  