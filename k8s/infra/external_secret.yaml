apiVersion:  external-secrets.io/v1beta1 
kind: ExternalSecret
metadata:
  name: db-secret
  namespace: default

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-store
    kind: ClusterSecretStore

  target:
    name: db-secret
    creationPolicy: Owner

  data:
    - secretKey: DB_HOST
      remoteRef:
        key: ecommerce-db-secret
        property: DB_HOST

    - secretKey: DB_USER
      remoteRef:
        key: ecommerce-db-secret
        property: DB_USER

    - secretKey: DB_PASSWORD
      remoteRef:
        key: ecommerce-db-secret
        property: DB_PASSWORD

    - secretKey: DB_NAME
      remoteRef:
        key: ecommerce-db-secret
        property: DB_NAME

    - secretKey: DB_PORT
      remoteRef:
        key: ecommerce-db-secret
        property: DB_PORT