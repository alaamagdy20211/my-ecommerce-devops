apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-statefulset
  namespace: default
spec:
  serviceName: "db"
  replicas: 1
  selector:
    matchLabels:
      app: db
      type: devops-statefulset

  template:
    metadata:
      labels:
        app: db
        type: devops-statefulset

    spec:
      terminationGracePeriodSeconds: 10

      containers:
      - name: db
        image: mongo:latest
        ports:
        - containerPort: 27017
          name: mongo

        volumeMounts:
        - name: mongo-persistent-storage
          mountPath: /data/db

        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_USER

        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_PASSWORD

        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

  volumeClaimTemplates:
  - metadata:
      name: mongo-persistent-storage
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: ebs-sc
      resources:
        requests:
          storage: 1Gi