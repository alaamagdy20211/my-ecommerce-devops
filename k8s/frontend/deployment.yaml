apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      type: devops-frontend
  template:
    metadata:
      labels:
        app: frontend
        type: devops-frontend
    spec:
      containers:
      - name: frontend
        image: alaa/node-react-ecommerce-backend:latest
        ports:
        - containerPort: 3000

    
  