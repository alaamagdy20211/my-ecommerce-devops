services:
   mongodb:
    image: mongo:5.0.2
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=alaa3008
      - MONGO_INITDB_ROOT_PASSWORD=123
    ports:
      - 27001:27017
    volumes:
      - db:/data/db

   backend:
    image: nodejs-backend:alaa3008
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=mongodb
      - DB_USER=alaa3008
      - DB_PASSWORD=123
      - DB_NAME=ecommerce
      - DB_PORT=27017
    depends_on:
      - mongodb

   frontend:
    image: nodejs-frontend:alaa3008
    ports:
      - "3000:3000"
volumes:
  db:

    

  

